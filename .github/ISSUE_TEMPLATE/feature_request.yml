name: Feature request
description: Suggest a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you hit, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?

  - type: textarea
    id: alternatives
    attributes:
      label: What did you try instead?
      description: Existing commands, flags, or manual workarounds.
